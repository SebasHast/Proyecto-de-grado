<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hombre - Clothes</title>
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../fonts/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/Estilos/style.css">
  <link rel="stylesheet" href="/Estilos/categorias.css">
</head>

<body>
  <div id="header"></div>

  <main>
    <section class="categoria-intro text-center py-4">
      <h2>DESCUBRE TU ESTILO</h2>
      <p>
        Inspírate con nuestra galería y encuentra tu look ideal entre los diferentes
        estilos de moda masculina en Colombia.
      </p>
    </section>

    <section class="categoria-estilos container pb-5">
      <div class="row g-4">
        <div class="col-6 col-md-3">
          <article class="estilo">
            <img src="/Imagenes/Samples/Summer_hombre.jpg" alt="Summer Vibes">
            <h3>SUMMER VIBES</h3>
          </article>
        </div>
        <div class="col-6 col-md-3">
          <article class="estilo">
            <img src="/Imagenes/Samples/Streetwear_hombre.jpg" alt="Streetwear">
            <h3>STREETWEAR</h3>
          </article>
        </div>
        <div class="col-6 col-md-3">
          <article class="estilo">
            <img src="/Imagenes/Samples/Casual_hombre.jpg" alt="Casual">
            <h3>CASUAL</h3>
          </article>
        </div>
        <div class="col-6 col-md-3">
          <article class="estilo">
            <img src="/Imagenes/Samples/Basico_hombre.jpg" alt="Basic">
            <h3>BASIC</h3>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('../header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;

        const root = document.documentElement;

        function getStoredTheme() {
          return localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function setTheme(theme) {
          root.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
          document.querySelectorAll('[data-action="toggle-theme"] i').forEach(icon => {
            icon.classList.toggle('fa-moon', theme !== 'dark');
            icon.classList.toggle('fa-sun', theme === 'dark');
          });
        }

        function wireButtons() {
          document.querySelectorAll('[data-action="toggle-theme"]').forEach(btn => {
            btn.addEventListener('click', () => {
              const next = (localStorage.getItem('theme') || getStoredTheme()) === 'dark' ? 'light' : 'dark';
              setTheme(next);
            });
          });
        }

        setTheme(getStoredTheme());
        wireButtons();
      });
  </script>
</body>

</html>
